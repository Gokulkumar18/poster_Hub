<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<title>Sign in — Aura Poster Hub</title>
<link rel="stylesheet" href="../Css/login.css">
</head>
<body>

<div class="container">
  <div class="logo">Aura Poster Hub</div>
  <h1 class="title">Welcome Back!</h1>
  <p class="subtitle">Enter your details to login</p>

  <form>

    <div class="form-group">
      <label class="label" for="name">Full Name</label>
      <input class="input" type="text" id="name" name="name" placeholder="Enter your name" required>
      <div class="error">Name is required.</div>
    </div>

    <div class="form-group">
      <label class="label" for="email">Email Address</label>
      <input class="input" type="email" id="email" name="email" placeholder="Enter your email" required>
      <div class="error">Enter a valid email address.</div>
    </div>

    <div class="form-group">
      <label class="label" for="password">Password</label>
      <input class="input" type="password" id="password" name="password" placeholder="Enter your password" required>
      <div class="error">Password is required.</div>
    </div>

    <div class="options-row">
      <label class="checkbox-label">
        <input type="checkbox" name="remember">
        Remember me
      </label>
      <a class="link" href="#">Forgot password?</a>
    </div>

    <button type="button" class="btn-alt">
  <i class="fa-brands fa-google"></i>
  Sign in with Google
</button>

    <div class="divider">Or</div>

    <button type="button" class="btn-alt">
  <i class="fa-brands fa-apple"></i>
  Sign in with Apple
</button>

  </form>
</div>

</body>
</html>
