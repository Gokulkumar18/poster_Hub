<svg viewBox="0 0 720 130" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- connecting lines -->
  <line x1="60" y1="30" x2="180" y2="30" stroke="#2FAE60" stroke-width="3"/>
  <line x1="240" y1="30" x2="360" y2="30" stroke="#3D7FE0" stroke-width="3"/>
  <line x1="420" y1="30" x2="540" y2="30" stroke="#D9D9D9" stroke-width="3"/>
  <line x1="600" y1="30" x2="660" y2="30" stroke="#D9D9D9" stroke-width="3"/>

  <!-- Step 1: Order Placed (green) -->
  <circle cx="30" cy="30" r="26" fill="#2FAE60"/>
  <text x="30" y="38" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">1</text>
  <text x="30" y="82" text-anchor="middle" fill="#1A1A1A" font-size="14" font-weight="bold">Order Placed</text>
  <text x="30" y="100" text-anchor="middle" fill="#2FAE60" font-size="12">14 Sept</text>

  <!-- Step 2: Processing (blue) -->
  <circle cx="210" cy="30" r="26" fill="#3D7FE0"/>
  <text x="210" y="38" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">2</text>
  <text x="210" y="82" text-anchor="middle" fill="#1A1A1A" font-size="14" font-weight="bold">Processing</text>
  <text x="210" y="100" text-anchor="middle" fill="#3D7FE0" font-size="12">15 Sept</text>

  <!-- Step 3: Shipped (orange) -->
  <circle cx="390" cy="30" r="26" fill="#E8842A"/>
  <text x="390" y="38" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">3</text>
  <text x="390" y="82" text-anchor="middle" fill="#1A1A1A" font-size="14" font-weight="bold">Shipped</text>
  <text x="390" y="100" text-anchor="middle" fill="#E8842A" font-size="12">17 Sept</text>

  <!-- Step 4: Out for Delivery (pending, gray) -->
  <circle cx="570" cy="30" r="26" fill="#E5E5E5"/>
  <text x="570" y="38" text-anchor="middle" fill="#999999" font-size="18" font-weight="bold">4</text>
  <text x="570" y="76" text-anchor="middle" fill="#1A1A1A" font-size="14" font-weight="bold">Out for</text>
  <text x="570" y="93" text-anchor="middle" fill="#1A1A1A" font-size="14" font-weight="bold">Delivery</text>
  <text x="570" y="111" text-anchor="middle" fill="#999999" font-size="12">Pending</text>

  <!-- Step 5: Delivered (pending, gray) -->
  <circle cx="690" cy="30" r="26" fill="#E5E5E5"/>
  <text x="690" y="38" text-anchor="middle" fill="#999999" font-size="18" font-weight="bold">5</text>
  <text x="690" y="82" text-anchor="middle" fill="#1A1A1A" font-size="14" font-weight="bold">Delivered</text>
  <text x="690" y="100" text-anchor="middle" fill="#999999" font-size="12">Pending</text>

</svg>
